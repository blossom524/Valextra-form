<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valextra</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <meta name="apple-mobile-web-app-title" content="Valextra">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #111;
      display: grid;
      place-items: center;
    }
    main {
      width: min(88%, 420px);
      text-align: center;
      padding: 36px 20px;
    }
    img {
      width: 128px;
      height: 128px;
      border-radius: 26px;
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    a.button {
      display: block;
      padding: 16px 18px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
    .hint {
      margin-top: 22px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <img src="./icon.png" alt="Valextra">
    <h1>Valextra</h1>
    <p>このページをiPhoneのホーム画面に追加してご利用ください。</p>
    <a class="button" href="https://forms.gle/LnjXkuNTan3ctnPS6">Googleフォームを開く</a>
    <p class="hint">Safariの共有ボタンから「ホーム画面に追加」を選択してください。</p>
  </main>
</body>
</html>
